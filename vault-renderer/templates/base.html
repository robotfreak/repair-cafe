<!doctype html>
<html lang="de" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Repair-Café Verwaltung{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .theme-toggle { cursor: pointer; border: none; background: transparent; color: inherit; font-size: 1.2rem; }
        .theme-toggle:hover { opacity: 0.8; }
        .vault-nav { background-color: rgba(0,0,0,0.1); padding: 1rem; border-radius: 0.5rem; }
        .markdown-body { line-height: 1.8; }
        .markdown-body h1 { border-bottom: 2px solid #0d6efd; padding-bottom: 0.5rem; }
        .markdown-body h2 { border-bottom: 1px solid #495057; padding-bottom: 0.3rem; }
        .markdown-body code { background-color: rgba(255,255,255,0.1); padding: 0.2rem 0.4rem; border-radius: 0.25rem; }
        .markdown-body pre { background-color: rgba(0,0,0,0.3); padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        /* Tabellen-Styling */
        .markdown-body table { width: 100%; margin: 1rem 0; border-collapse: collapse; }
        .markdown-body th, .markdown-body td { border: 1px solid rgba(255,255,255,0.2); padding: 0.75rem; text-align: left; }
        .markdown-body th { background-color: rgba(13,110,253,0.2); font-weight: 600; }
        .markdown-body tr:nth-child(even) { background-color: rgba(255,255,255,0.05); }
        .markdown-body tr:hover { background-color: rgba(255,255,255,0.1); }
        /* Interne Links */
        .markdown-body a { color: #0d6efd; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">🏢 Repair-Café Verwaltung</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">🏠 Übersicht</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vault/01-Tutorials">📚 Tutorials</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vault/02-Treffen">📅 Treffen</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vault/03-Werkzeug">🔧 Werkzeug</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vault/04-Geraete">📱 Geräte</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vault/05-Workshops">🎓 Workshops</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/vault/06-Vorlagen">📝 Vorlagen</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <button class="nav-link theme-toggle" id="themeToggle" title="Theme umschalten">🌙</button>
                </li>
            </ul>
        </div>
      </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-bs-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
        themeToggle.addEventListener('click', () => {
            const newTheme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('theme', newTheme);
        });
    </script>
  </body>
</html>
